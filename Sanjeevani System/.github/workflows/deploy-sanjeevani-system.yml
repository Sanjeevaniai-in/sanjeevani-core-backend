name: Deploy Sanjeevani System

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build -t asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/sanjeevani-images/sanjeevani-system:${{ github.sha }} "Sanjeevani System"

      - name: Push Docker image
        run: |
          docker push asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/sanjeevani-images/sanjeevani-system:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy sanjeevani-system \
            --image asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/sanjeevani-images/sanjeevani-system:${{ github.sha }} \
            --region asia-south1 \
            --platform managed \
            --allow-unauthenticated